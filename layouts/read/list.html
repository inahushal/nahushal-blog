{{ define "main" }}
<article class="post-card article reader-page">
  <h2 class="post-title">{{ .Title }}</h2>
  <p id="resume-box" hidden><a id="resume-link" href="#" data-page-label="Page" data-label="ކިޔަމުންދިޔަ ތަނުން ކިޔާލުމަށް">Continue reading</a></p>
  <ul class="reader-toc">
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</article>

<script>
(function () {
  "use strict";
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("reader-position")); } catch (e) {}
  if (!saved || !saved.path) { return; }
  var link = document.getElementById("resume-link");
  var box = document.getElementById("resume-box");
  if (!link || !box) { return; }
  var bm = null; try { bm = JSON.parse(localStorage.getItem("reader-bookmark")); } catch (e) {}
  if (bm && bm.path) { link.href = bm.path + "#bookmark"; saved = bm; } else { link.href = saved.path + "#resume"; }
  var pg = (saved.page ? " - " + (link.getAttribute("data-page-label") || "Page") + " " + saved.page : "");
  link.textContent = link.getAttribute("data-label") + ": " + saved.title + pg;
  box.hidden = false;
})();
</script>
{{ end }}

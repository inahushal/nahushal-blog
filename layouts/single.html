{{ define "main" }}
<article class="post-card article">
  <h2 class="post-title">{{ .Title }}</h2>
  {{ if not .Date.IsZero }}<time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}" >{{ partial "date.html" .Date }}</time>{{ end }}
  <div class="post-content">{{ .Content }}</div>
  {{ partial "share.html" . }}
  <a class="back-link" href="{{ site.Home.RelPermalink }}">ފުރަތަމަ ސަފްޙާއަށް</a>
</article>
{{ end }}

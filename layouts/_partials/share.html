{{- $url := .Permalink | urlquery -}}
{{- $title := .Title | urlquery -}}
<div class="share">
  <span class="share-label">ޝެއަރ ކުރައްވާ</span>
  <a class="share-btn" href="{{ printf "https://wa.me/?text=%s%%20%s" $title $url | safeURL }}" target="_blank" rel="noopener">WhatsApp</a>
  <a class="share-btn" href="{{ printf "https://www.facebook.com/sharer/sharer.php?u=%s" $url | safeURL }}" target="_blank" rel="noopener">Facebook</a>
  <a class="share-btn" href="{{ printf "https://t.me/share/url?url=%s&text=%s" $url $title | safeURL }}" target="_blank" rel="noopener">Telegram</a>
  <a class="share-btn" href="{{ printf "viber://forward?text=%s%%20%s" $title $url | safeURL }}">Viber</a>
  <a class="share-btn" href="{{ printf "https://twitter.com/intent/tweet?url=%s&text=%s" $url $title | safeURL }}" target="_blank" rel="noopener">X</a>
  <a class="share-btn" href="{{ printf "https://www.linkedin.com/sharing/share-offsite/?url=%s" $url | safeURL }}" target="_blank" rel="noopener">LinkedIn</a>
</div>

{{ with site.Params.ga4 }}{{ if hugo.IsProduction }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  (function () {
    try {
      var q = location.search;
      if (/[?&]notrack=1/.test(q)) { localStorage.setItem("nahushal-notrack", "1"); }
      if (/[?&]notrack=0/.test(q)) { localStorage.removeItem("nahushal-notrack"); }
      if (localStorage.getItem("nahushal-notrack") === "1") { window["ga-disable-{{ . }}"] = true; }
    } catch (e) {}
  })();
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');
</script>
{{ end }}{{ end }}

{{ if hugo.IsProduction }}
<script>
  (function () {
    try {
      var q = location.search;
      if (/[?&]notrack=1/.test(q)) { localStorage.setItem("nahushal-notrack", "1"); }
      if (/[?&]notrack=0/.test(q)) { localStorage.removeItem("nahushal-notrack"); }
      if (localStorage.getItem("nahushal-notrack") === "1") { return; }
      var h = location.hostname;
      if (h === "localhost" || h === "127.0.0.1") { return; }
      var v = ""; try { v = localStorage.getItem("nahushal-vid"); if (!v) { v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); localStorage.setItem("nahushal-vid", v); } } catch (e2) { v = ""; } var data = JSON.stringify({ p: location.pathname, r: document.referrer, v: v });
      var url = "https://nahushal-analytics.inahushal.workers.dev/collect";
      if (navigator.sendBeacon) { navigator.sendBeacon(url, data); }
      else { fetch(url, { method: "POST", body: data, keepalive: true, mode: "no-cors" }); }
    } catch (e) {}
  })();
</script>
{{ end }}

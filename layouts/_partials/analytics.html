{{ with site.Params.ga4 }}{{ if hugo.IsProduction }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>
  (function () {
    try {
      var q = location.search;
      if (/[?&]notrack=1/.test(q)) { localStorage.setItem("nahushal-notrack", "1"); }
      if (/[?&]notrack=0/.test(q)) { localStorage.removeItem("nahushal-notrack"); }
      if (localStorage.getItem("nahushal-notrack") === "1") { window["ga-disable-{{ . }}"] = true; }
    } catch (e) {}
  })();
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');
</script>
{{ end }}{{ end }}

{{ if hugo.IsProduction }}
<script>
  (function () {
    try {
      var q = location.search;
      if (/[?&]notrack=1/.test(q)) { localStorage.setItem("nahushal-notrack", "1"); }
      if (/[?&]notrack=0/.test(q)) { localStorage.removeItem("nahushal-notrack"); }
      if (localStorage.getItem("nahushal-notrack") === "1") { return; }
      var h = location.hostname;
      if (h === "localhost" || h === "127.0.0.1") { return; }
      var v = ""; try { v = localStorage.getItem("nahushal-vid"); if (!v) { v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); localStorage.setItem("nahushal-vid", v); } } catch (e2) { v = ""; } var data = JSON.stringify({ p: location.pathname, r: document.referrer, v: v });
      var url = "https://nahushal-analytics.inahushal.workers.dev/collect";
      if (navigator.sendBeacon) { navigator.sendBeacon(url, data); }
      else { fetch(url, { method: "POST", body: data, keepalive: true, mode: "no-cors" }); }
    } catch (e) {}
  })();
</script>
<script>
(function () {
  var EP = "https://nahushal-analytics.inahushal.workers.dev/event";
  var vid = "";
  try {
    vid = localStorage.getItem("nh_ev_id") || "";
    if (!vid) {
      vid = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now();
      localStorage.setItem("nh_ev_id", vid);
    }
  } catch (e) {}
  function send(n, d) {
    try {
      fetch(EP, { method: "POST", keepalive: true, headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ n: n, d: d || "", p: location.pathname, v: vid }) });
    } catch (e) {}
  }
  window.nhTrack = send;

  var cSeen = false;
  function watchComments() {
    var el = document.querySelector('#comments,.comments,#disqus_thread,.giscus,#giscus,[id*="comment"],[class*="comment"]');
    if (!el || !("IntersectionObserver" in window)) return;
    new IntersectionObserver(function (en, ob) {
      if (en[0].isIntersecting && !cSeen) { cSeen = true; send("comments_seen", (document.title || "").slice(0, 80)); ob.disconnect(); }
    }).observe(el);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", watchComments); else watchComments();

  document.addEventListener("submit", function (e) {
    var fm = e.target;
    return; /* generic submit detector disabled: comments are tracked on success in comments.html */
    var s = (fm.id + " " + fm.className + " " + (fm.getAttribute("action") || "")).toLowerCase();
    if (/comment|reply|respond/.test(s) || (fm.closest && fm.closest('[id*="comment"],[class*="comment"]'))) {
      send("comment", (document.title || "").slice(0, 80));
    }
  }, true);

  var gcount = null;
  addEventListener("message", function (e) {
    if (e.origin !== "https://giscus.app") return;
    var d = e.data && e.data.giscus && e.data.giscus.discussion;
    if (!d || typeof d.totalCommentCount !== "number") return;
    if (gcount !== null && d.totalCommentCount > gcount) send("comment", (document.title || "").slice(0, 80));
    gcount = d.totalCommentCount;
  });

  var seen = {};
  addEventListener("scroll", function () {
    var h = document.documentElement;
    var total = h.scrollHeight - h.clientHeight;
    if (total < 200) return;
    var pct = (window.scrollY || h.scrollTop) / total * 100;
    [25, 50, 75, 100].forEach(function (m) {
      if (pct >= m - 1 && !seen[m]) { seen[m] = 1; send("scroll", String(m)); }
    });
  }, { passive: true });

  document.addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest(
      '[data-bookmark],.bookmark,[class*="bookmark"],[id*="bookmark"],[aria-label*="bookmark" i],[title*="bookmark" i]');
    if (el) send("bookmark", (document.title || "").slice(0, 80));
  });
})();</script>
{{ end }}
